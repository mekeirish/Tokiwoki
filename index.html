    <!-- JS APPLICATION LOGIC -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Register Inline Service Worker for PWA capability
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW reg error:', err));
        }

        // State Variables
        let peer = null;
        let activeCall = null;
        let localAudioStream = null;
        let localAudioTrack = null;
        let audioCtx = null;
        let incomingAnalyser = null;
        let isTransmitting = false;
        let isMuted = false;
        let videoScannerStream = null;

        // UI Element References
        const myPeerIdEl = document.getElementById('myPeerId');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const pttBtn = document.getElementById('pttBtn');
        const pttInstruction = document.getElementById('pttInstruction');
        const micStatus = document.getElementById('micStatus');
        const micStatusText = document.getElementById('micStatusText');
        const remotePeerIdInput = document.getElementById('remotePeerIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const peerConnectedInfo = document.getElementById('peerConnectedInfo');
        const connectedPeerIdShort = document.getElementById('connectedPeerIdShort');
        const remoteAudio = document.getElementById('remoteAudio');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');
        const receptiveSignalText = document.getElementById('receptiveSignalText');

        // Random Clean Peer ID Generator (walkie-XXXX)
        function generateWalkieId() {
            const chars = '23456789abcdefghjkmnpqrstuvwxyz';
            let randomStr = '';
            for (let i = 0; i < 4; i++) {
                randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return `walkie-${randomStr}`;
        }

        const myGeneratedId = generateWalkieId();

        // Web Audio Synthesizer: Sound Effects (Squelch / Roger Beep)
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Realistic Squelch Noise + Roger Beep Sound Generator
        function playRadioSound(type) {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;

                if (type === 'start') {
                    // Squelch Burst on PTT press
                    const bufferSize = audioCtx.sampleRate * 0.08; // 80ms noise
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1200, now);
                    filter.Q.setValueAtTime(3.0, now);

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noise.start(now);
                } else if (type === 'roger') {
                    // Classic dual-tone Roger Beep on release / transmission end
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(1200, now);
                    osc2.frequency.setValueAtTime(1200, now + 0.07);

                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc1.start(now);
                    osc1.stop(now + 0.07);
                    osc2.start(now + 0.07);
                    osc2.stop(now + 0.15);
                }
            } catch (e) {
                console.log("Audio FX error:", e);
            }
        }

        // Haptic Feedback Helper
        function triggerHaptic(pattern = 30) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            }
        }

        // User Media Initialization (Microphone)
        async function initMicrophone() {
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });

                localAudioTrack = localAudioStream.getAudioTracks()[0];
                localAudioTrack.enabled = false; // Muted by default until PTT pressed

                micStatus.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                micStatusText.textContent = "Micro Prêt";
                micStatus.querySelector('i').replaceWith(lucide.createIcons());
                
                return true;
            } catch (err) {
                console.error("Microphone Access Error:", err);
                micStatus.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                micStatusText.textContent = "Micro Refusé";
                alert("Accès microphone requis pour utiliser le Talkie-Walkie.");
                return false;
            }
        }

        // Initialize PeerJS Connection Broker
        function initPeer() {
            updateStatus('connecting', 'Connexion au serveur...');
            
            peer = new Peer(myGeneratedId, {
                debug: 1
            });

            peer.on('open', (id) => {
                myPeerIdEl.textContent = id;
                updateStatus('ready', 'Prêt à connecter');
            });

            peer.on('call', async (call) => {
                // Auto-answer incoming call
                if (!localAudioStream) {
                    await initMicrophone();
                }
                
                call.answer(localAudioStream);
                setupCallHandlers(call);
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'peer-not-found') {
                    alert("Correspondant introuvable. Vérifiez l'ID.");
                }
                updateStatus('ready', 'Erreur de connexion');
            });

            peer.on('disconnected', () => {
                updateStatus('disconnected', 'Déconnecté');
            });
        }

        // Setup Call Handlers & Stream Binding
        function setupCallHandlers(call) {
            activeCall = call;

            call.on('stream', (remoteStream) => {
                remoteAudio.srcObject = remoteStream;
                remoteAudio.volume = parseFloat(volumeSlider.value);
                
                const connectedId = call.peer;
                connectedPeerIdShort.textContent = connectedId;
                peerConnectedInfo.classList.remove('hidden');
                
                updateStatus('connected', `Relier à ${connectedId}`);
                pttBtn.disabled = false;
                pttInstruction.textContent = "Maintenez le bouton orange pour transmettre l'audio";

                // Attach incoming audio analyzer for visualizer
                setupIncomingAudioVisualizer(remoteStream);
                playRadioSound('roger');
            });

            call.on('close', () => {
                handleCallDisconnected();
            });

            call.on('error', (err) => {
                console.error("Call error:", err);
                handleCallDisconnected();
            });
        }

        function handleCallDisconnected() {
            activeCall = null;
            peerConnectedInfo.classList.add('hidden');
            pttBtn.disabled = true;
            pttInstruction.textContent = "Connectez-vous à un correspondant pour émettre";
            updateStatus('ready', 'Prêt à connecter');
            playRadioSound('roger');
        }

        // Connection Status Indicator Updater
        function updateStatus(state, message) {
            statusText.textContent = message;
            statusDot.className = "w-2.5 h-2.5 rounded-full inline-block ";
            
            if (state === 'connecting') {
                statusDot.classList.add('bg-amber-500', 'animate-pulse');
            } else if (state === 'ready') {
                statusDot.classList.add('bg-blue-500');
            } else if (state === 'connected') {
                statusDot.classList.add('bg-emerald-500', 'animate-pulse');
            } else {
                statusDot.classList.add('bg-red-500');
            }
        }

        // Connect to Remote Peer Action
        async function connectToPeer(targetPeerId) {
            if (!targetPeerId) return;
            targetPeerId = targetPeerId.trim();

            if (targetPeerId === myGeneratedId) {
                alert("Vous ne pouvez pas vous connecter à vous-même.");
                return;
            }

            updateStatus('connecting', `Appel de ${targetPeerId}...`);

            if (!localAudioStream) {
                const micGranted = await initMicrophone();
                if (!micGranted) return;
            }

            const call = peer.call(targetPeerId, localAudioStream);
            setupCallHandlers(call);
        }

        // Incoming Audio Visualizer (Canvas Waveform / Signal Meter)
        function setupIncomingAudioVisualizer(stream) {
            initAudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            incomingAnalyser = audioCtx.createAnalyser();
            incomingAnalyser.fftSize = 64;
            source.connect(incomingAnalyser);

            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = canvas.offsetHeight;

            canvasCtx.clearRect(0, 0, width, height);

            if (!incomingAnalyser || !activeCall) {
                receptiveSignalText.classList.remove('hidden');
                return;
            }

            const bufferLength = incomingAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            incomingAnalyser.getByteFrequencyData(dataArray);

            // Calculate average volume level
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            const average = sum / bufferLength;

            if (average > 10) {
                receptiveSignalText.classList.add('hidden');
            } else {
                receptiveSignalText.classList.remove('hidden');
            }

            // Draw Audio Spectrum Bars
            const barWidth = (width / bufferLength) * 1.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * height;

                const gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, 'rgba(255, 152, 0, 0.2)');
                gradient.addColorStop(1, '#ff9800');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);

                x += barWidth;
            }
        }

        // Push-To-Talk (PTT) Logic
        function startTransmission(e) {
            if (e) e.preventDefault();
            if (!activeCall || isTransmitting) return;

            initAudioContext();
            isTransmitting = true;

            if (localAudioTrack) {
                localAudioTrack.enabled = true;
            }

            pttBtn.classList.add('active');
            pttInstruction.textContent = "TRANSMISSION AUDIO EN COURS...";
            pttInstruction.classList.add('text-amber-400', 'font-bold');

            triggerHaptic([40]);
            playRadioSound('start');
        }

        function stopTransmission(e) {
            if (e) e.preventDefault();
            if (!isTransmitting) return;

            isTransmitting = false;

            if (localAudioTrack) {
                localAudioTrack.enabled = false;
            }

            pttBtn.classList.remove('active');
            pttInstruction.textContent = "Maintenez le bouton orange pour transmettre l'audio";
            pttInstruction.classList.remove('text-amber-400', 'font-bold');

            triggerHaptic([20, 30]);
            playRadioSound('roger');
        }

        // PTT Event Listeners (Touch & Mouse Support)
        pttBtn.addEventListener('mousedown', startTransmission);
        pttBtn.addEventListener('mouseup', stopTransmission);
        pttBtn.addEventListener('mouseleave', stopTransmission);

        pttBtn.addEventListener('touchstart', startTransmission, { passive: false });
        pttBtn.addEventListener('touchend', stopTransmission, { passive: false });
        pttBtn.addEventListener('touchcancel', stopTransmission, { passive: false });

        // Volume & Mute Controls
        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            remoteAudio.volume = val;
            if (val === 0) {
                isMuted = true;
                muteIcon.setAttribute('data-lucide', 'volume-x');
            } else {
                isMuted = false;
                muteIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                remoteAudio.volume = 0;
                volumeSlider.value = 0;
                muteIcon.setAttribute('data-lucide', 'volume-x');
            } else {
                remoteAudio.volume = 1;
                volumeSlider.value = 1;
                muteIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        });

        // Copy ID Button
        document.getElementById('copyIdBtn').addEventListener('click', () => {
            const textToCopy = myPeerIdEl.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy);
            } else {
                // Fallback execCommand
                const input = document.createElement('input');
                input.value = textToCopy;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
            }
            triggerHaptic(20);
            alert(`ID Talkie copié : ${textToCopy}`);
        });

        // Manual Connection Form Submit
        connectBtn.addEventListener('click', () => {
            const targetId = remotePeerIdInput.value;
            connectToPeer(targetId);
        });

        // QR Code Generator Modal Handler
        const qrModal = document.getElementById('qrModal');
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const qrPeerIdText = document.getElementById('qrPeerIdText');

        document.getElementById('showQrBtn').addEventListener('click', () => {
            qrcodeContainer.innerHTML = '';
            new QRCode(qrcodeContainer, {
                text: myGeneratedId,
                width: 180,
                height: 180,
                colorDark: "#121212",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            qrPeerIdText.textContent = myGeneratedId;
            qrModal.classList.remove('hidden');
        });

        document.getElementById('closeQrModal').addEventListener('click', () => {
            qrModal.classList.add('hidden');
        });

        // QR Code Scanner Logic via Native Camera getUserMedia
        const scannerModal = document.getElementById('scannerModal');
        const scannerVideo = document.getElementById('scannerVideo');

        document.getElementById('scanQrBtn').addEventListener('click', async () => {
            scannerModal.classList.remove('hidden');
            try {
                videoScannerStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                scannerVideo.srcObject = videoScannerStream;
            } catch (err) {
                alert("Impossible d'accéder à la caméra pour scanner.");
                scannerModal.classList.add('hidden');
            }
        });

        function closeScanner() {
            if (videoScannerStream) {
                videoScannerStream.getTracks().forEach(track => track.stop());
                videoScannerStream = null;
            }
            scannerModal.classList.add('hidden');
        }

        document.getElementById('closeScannerModal').addEventListener('click', closeScanner);

        // QR Code File Upload Fallback Scanner
        document.getElementById('qrFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Manual QR Decode attempt prompt for fallback
                    const promptVal = prompt("ID du Talkie détecté sur l'image (saisie rapide) :", "");
                    if (promptVal) {
                        remotePeerIdInput.value = promptVal;
                        closeScanner();
                        connectToPeer(promptVal);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // App Initialization on Page Load
        window.addEventListener('load', () => {
            initPeer();
            // Pre-request microphone permission on first click anywhere
            document.body.addEventListener('click', () => {
                initAudioContext();
                if (!localAudioStream) {
                    initMicrophone();
                }
            }, { once: true });
        });
    </script>
